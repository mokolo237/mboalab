<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mboa Lab</title>
  <meta name="description" content="Atelier libre et hors ligne pour apprendre et réaliser en réseau, télécoms, développement web et maintenance.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
/* Mboa Lab 0.2 — feuille de style unique, sans framework.
   Les couleurs sont des variables : modifiez-les pour créer votre thème. */

:root {
  --accent: #0f766e;
  --font-scale: 1;
  --bg: #f6f7f6;
  --surface: #ffffff;
  --soft: #eef1ef;
  --text: #121a17;
  --muted: #5d6965;
  --line: #e2e7e4;
  --warn: #9a5b00;
  --warn-bg: #fff6e5;
  --ok: #15803d;
  --bad: #c62828;
  --net-bit: #0f766e;
  --host-bit: #c2410c;
  --r: 14px;
  --accent-soft: color-mix(in srgb, var(--accent) 11%, transparent);
  --accent-ink: color-mix(in srgb, var(--accent) 85%, var(--text));
  color-scheme: light;
}
:root[data-theme="sombre"] { --bg: #0e1311; --surface: #161d1a; --soft: #1e2723; --text: #e7edea; --muted: #9aa7a1; --line: #29332f; --warn: #f2b84b; --warn-bg: #2a2213; --net-bit: #5eead4; --host-bit: #fdba74; --accent-ink: color-mix(in srgb, var(--accent) 60%, #fff); color-scheme: dark; }
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] { --bg: #0e1311; --surface: #161d1a; --soft: #1e2723; --text: #e7edea; --muted: #9aa7a1; --line: #29332f; --warn: #f2b84b; --warn-bg: #2a2213; --net-bit: #5eead4; --host-bit: #fdba74; --accent-ink: color-mix(in srgb, var(--accent) 60%, #fff); color-scheme: dark; }
}

* { box-sizing: border-box; min-width: 0; }
[hidden] { display: none !important; }
html { font-size: calc(16px * var(--font-scale)); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 1rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  padding-bottom: calc(68px + env(safe-area-inset-bottom));
  overflow-x: clip;
}
a { color: var(--accent-ink); }
h1 { font-size: 1.5rem; line-height: 1.2; margin: 0; letter-spacing: -.015em; }
h2 { font-size: 1.05rem; margin: 0 0 .8rem; }
h3 { font-size: 1rem; margin: 1rem 0 .5rem; }
.h-small { font-size: .95rem; color: var(--muted); font-weight: 600; margin: 1.4rem 0 .6rem; }
p { margin: 0 0 .7rem; }
code, pre { font-family: ui-monospace, "Cascadia Code", "DejaVu Sans Mono", Menlo, monospace; font-size: .88em; }
code { background: var(--soft); padding: .06em .35em; border-radius: 5px; overflow-wrap: anywhere; }
pre { background: var(--soft); padding: .9rem 1rem; border-radius: 10px; overflow-x: auto; line-height: 1.45; margin: .6rem 0; }
pre code { background: none; padding: 0; overflow-wrap: normal; }
.hint { color: var(--muted); font-size: .86rem; }
.center { text-align: center; }
.i { flex: none; vertical-align: middle; }
.i.up { transform: rotate(90deg); }
.i.down { transform: rotate(-90deg); }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 2px; }
.fade { animation: fade .22s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- Barre du haut & navigation ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .6rem;
  padding: .55rem 1rem; background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.brand { display: flex; gap: .5rem; align-items: center; text-decoration: none; color: var(--text); font-weight: 700; margin-right: auto; }
.offline-badge { display: none; font-size: .75rem; color: var(--warn); background: var(--warn-bg); padding: .15rem .6rem; border-radius: 99px; }
body.offline .offline-badge { display: inline-block; }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 0;
  background: transparent; color: var(--muted); cursor: pointer; text-decoration: none; flex: none;
}
.icon-btn:hover, .icon-btn.active { color: var(--accent-ink); background: var(--accent-soft); }
.icon-btn[disabled] { opacity: .3; cursor: default; background: none; }

.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex;
  background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
.nav a {
  flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: .5rem .2rem .45rem; color: var(--muted); text-decoration: none; font-size: .68rem; font-weight: 500;
}
.nav a.active { color: var(--accent-ink); }
.nav a.active .i { stroke-width: 2.3; }
.lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.lbl.l { display: none; }
@media (min-width: 960px) { .lbl.s { display: none; } .lbl.l { display: inline; } }

#view { display: block; max-width: 860px; margin: 0 auto; padding: 1.1rem 1rem 2rem; outline: none; }

@media (min-width: 960px) {
  body { padding: 0 0 0 220px; }
  .topbar { margin-left: -220px; }
  .nav {
    top: 57px; right: auto; width: 220px; flex-direction: column; gap: 2px; border: 0;
    border-right: 1px solid var(--line); padding: 1rem .7rem; background: var(--bg);
  }
  .nav a { flex: none; flex-direction: row; gap: .75rem; font-size: .93rem; padding: .6rem .8rem; border-radius: 10px; }
  .nav a:hover { background: var(--soft); color: var(--text); }
  .nav a.active { background: var(--accent-soft); }
  #view { padding: 2rem 2rem 3rem; }
}

/* ---------- En-têtes ---------- */
.page-head { margin: 0 0 1.2rem; }
.page-head h1 { display: flex; align-items: center; gap: .6rem; }
.h-ico { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; background: var(--accent-soft); color: var(--accent-ink); flex: none; }
.page-head .sub { color: var(--muted); margin: .35rem 0 0; }
.back { display: inline-flex; align-items: center; gap: .25rem; font-size: .9rem; text-decoration: none; color: var(--muted); margin-bottom: .6rem; }
.back:hover { color: var(--accent-ink); }

/* ---------- Cartes & formulaires ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.1rem; margin: 0 0 1rem; }
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .6rem; }
.card-head h2 { margin: 0; }
.form label, label.f { display: flex; flex-direction: column; gap: .3rem; font-size: .86rem; font-weight: 600; margin-bottom: .9rem; }
.label { font-size: .86rem; font-weight: 600; margin: .2rem 0 .4rem; }
input, select, textarea {
  font: inherit; font-size: max(16px, 1rem); color: var(--text); background: var(--bg); width: 100%;
  border: 1px solid var(--line); border-radius: 10px; padding: .6rem .8rem; min-height: 46px; font-weight: 400;
}
textarea { resize: vertical; min-height: 96px; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: 3px solid var(--accent-soft); }
input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
input[type="color"] { padding: 0; }
.grid2, .grid3 { display: grid; gap: 0 1rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 600px) { .grid2, .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 860px) { .grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 44px;
  padding: .5rem 1rem; border-radius: 11px; border: 1px solid var(--line); background: var(--surface);
  color: var(--text); font: inherit; font-weight: 600; font-size: .93rem; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--soft); color: var(--text); }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.small { min-height: 38px; padding: .3rem .8rem; font-size: .86rem; }
.btn.on { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }
.btn.on .i { fill: currentColor; }
.row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .2rem 0 1rem; }
.row.end { justify-content: flex-end; margin: 1rem 0 0; }
.link { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; text-decoration: underline; padding: .3rem; }
.link.small { font-size: .8rem; }

/* Onglets & contrôles segmentés */
.tabs { display: flex; gap: .25rem; padding: .25rem; background: var(--soft); border-radius: 12px; margin: 0 0 1rem; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: 1 0 auto; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; font-size: .9rem;
  padding: .55rem .9rem; border-radius: 9px; cursor: pointer; min-height: 40px;
}
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.seg { display: flex; gap: .25rem; padding: .25rem; background: var(--soft); border-radius: 12px; margin: 0 0 .9rem; }
.seg.wrap { flex-wrap: wrap; background: none; padding: 0; gap: .4rem; }
.seg label { flex: 1 1 auto; margin: 0; display: block; font-weight: 500; font-size: .88rem; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; min-height: 0; }
.seg span { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 38px; padding: .35rem .7rem; border-radius: 9px; cursor: pointer; color: var(--muted); }
.seg.wrap span { border: 1px solid var(--line); background: var(--surface); }
.seg input:checked + span { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.seg.wrap input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); box-shadow: none; }
.seg input:focus-visible + span { outline: 3px solid var(--accent-soft); }

.chips, .filters { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin: .8rem 0 0; }
.filters { margin: 0 0 1rem; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 99px;
  padding: .35rem .85rem; font: inherit; font-size: .84rem; cursor: pointer; white-space: nowrap; min-height: 36px;
}
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--text); border-color: var(--text); color: var(--bg); }
.chip-pair { display: inline-flex; }
.chip-pair .chip { border-radius: 99px 0 0 99px; border-right: 0; }
.chip-x { border: 1px solid var(--line); border-left: 0; background: var(--surface); color: var(--muted); border-radius: 0 99px 99px 0; padding: 0 .55rem; cursor: pointer; display: grid; place-items: center; }
.chip-x:hover { color: var(--bad); }
.tag { font-size: .7rem; background: var(--accent-soft); color: var(--accent-ink); padding: .05rem .45rem; border-radius: 99px; font-weight: 600; }

.notice { padding: .65rem .9rem; border-radius: 10px; margin: 0 0 1rem; font-size: .92rem; }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.notice.small { font-size: .84rem; padding: .45rem .7rem; margin-bottom: .5rem; }
.empty { text-align: center; color: var(--muted); padding: 2.2rem 1rem; }
.empty .i { opacity: .35; margin-bottom: .4rem; }
.empty p { margin: 0 auto; max-width: 32ch; font-size: .92rem; }

/* Chiffres clés */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .5rem; margin: 0 0 1rem; }
.stats > div { background: var(--soft); border-radius: 12px; padding: .7rem .85rem; }
.stats span { display: block; font-size: .76rem; color: var(--muted); }
.stats b { display: block; font-size: 1.12rem; line-height: 1.3; }
@media (max-width: 480px) { .stats { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); } .stats b { font-size: .98rem; letter-spacing: -.01em; } .tabs button { padding: .5rem .6rem; font-size: .86rem; } }
.stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .45rem 1rem; margin: 0 0 .5rem; font-size: .92rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* Tableaux */
.scroll { overflow-x: auto; }
.table { border-collapse: collapse; width: 100%; font-size: .88rem; }
.table th, .table td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.table thead th { font-weight: 600; color: var(--muted); font-size: .78rem; white-space: nowrap; }
.table .num { text-align: right; white-space: nowrap; }
.table tfoot th { padding-top: .75rem; border: 0; }
.table tfoot th:first-child { text-align: right; font-weight: 500; color: var(--muted); }
.table tr.opt td { color: var(--muted); }
.table td .hint { font-size: .78rem; }

/* Explications */
.explain { margin-top: .9rem; border-radius: 12px; background: var(--soft); }
.explain summary { cursor: pointer; padding: .7rem .9rem; font-weight: 600; font-size: .92rem; color: var(--accent-ink); list-style: none; display: flex; gap: .5rem; align-items: center; min-height: 44px; }
.explain summary::-webkit-details-marker { display: none; }
.explain-body { padding: 0 1rem 1rem; font-size: .93rem; }
.explain-body ul, .explain-body ol { padding-left: 1.2rem; margin: 0 0 .5rem; }
.tip { background: var(--surface); padding: .6rem .8rem; border-radius: 10px; font-size: .88rem; margin: .5rem 0 0; }
.bin { font-size: .9rem; background: var(--surface); padding: .2rem .5rem; display: inline-block; max-width: 100%; overflow-x: auto; white-space: nowrap; }
.bin .bn, .legend .bn { color: var(--net-bit); font-weight: 700; }
.bin .bh, .legend .bh { color: var(--host-bit); font-weight: 700; }
.bin .dot { color: var(--muted); }
.binrow { display: flex; flex-wrap: wrap; gap: .25rem .8rem; align-items: center; margin: .35rem 0 .5rem; }
.binrow > span { min-width: 9em; font-family: ui-monospace, monospace; font-size: .85rem; color: var(--muted); }
.legend { font-size: .82rem; color: var(--muted); }
.steps { padding-left: 1.1rem; }
.steps li { margin-bottom: .5rem; }
.bits { border-collapse: collapse; }
.bits th, .bits td { border: 1px solid var(--line); padding: .3rem .5rem; text-align: center; font-family: ui-monospace, monospace; font-size: .8rem; }
.bits td.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }
@media (max-width: 480px) { .bin { font-size: .72rem; } .binrow > span { min-width: 0; } }

/* ---------- Accueil ---------- */
.hero { padding: 1.4rem 0 .4rem; }
.hero h1 { font-size: clamp(1.6rem, 6vw, 2.1rem); }
.hero .sub { color: var(--muted); margin: .4rem 0 1.1rem; }
.ask { position: relative; display: flex; gap: .5rem; }
.ask input { padding-left: 2.8rem; min-height: 54px; border-radius: 14px; background: var(--surface); font-size: 1.05rem; box-shadow: 0 2px 10px rgba(0, 0, 0, .04); }
.ask .ask-ico { position: absolute; left: .95rem; top: 17px; color: var(--muted); pointer-events: none; }
.ask .btn { min-height: 54px; width: 54px; padding: 0; border-radius: 14px; flex: none; }
#answer { margin: 1.2rem 0 0; }
#answer:empty { display: none; }
.answer { border-left: 3px solid var(--accent); }
.answer ul { padding-left: 1.2rem; margin: 0; }
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; margin: 1.6rem 0 1rem; }
.tool {
  display: flex; flex-direction: column; gap: .7rem; padding: 1rem; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); text-decoration: none; color: var(--text); font-weight: 600; font-size: .95rem; transition: border-color .15s, transform .15s;
}
.tool .i { color: var(--accent-ink); }
.tool:hover { border-color: var(--accent); transform: translateY(-2px); }
.resume { display: grid; grid-template-columns: auto 1fr; gap: .3rem .7rem; align-items: center; padding: .9rem 1rem; border-radius: var(--r); background: var(--accent-soft); color: var(--text); text-decoration: none; font-size: .92rem; }
.resume .i { color: var(--accent-ink); }
.resume progress { grid-column: 2; }

/* Cartes de fiches, projets, parcours */
.list-cards { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); margin: 0 0 1rem; }
.fiche-card, .path-card, .proj { display: flex; flex-direction: column; gap: .2rem; padding: .9rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--text); transition: border-color .15s; }
.fiche-card:hover, .path-card:hover, .proj:hover { border-color: var(--accent); }
.fiche-card .meta { font-size: .74rem; color: var(--muted); display: flex; align-items: center; gap: .25rem; flex-wrap: wrap; }
.fiche-card .meta .i { color: var(--accent-ink); }
.fiche-card strong { line-height: 1.3; }
.fiche-card .hint { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.proj { flex-direction: row; align-items: center; gap: .5rem; padding-right: .5rem; }
.proj-main { flex: 1; display: flex; flex-direction: column; gap: .25rem; text-decoration: none; color: var(--text); }
.path-card { flex-direction: row; align-items: center; gap: .9rem; }
.p-ico { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); flex: none; }
.p-body { flex: 1; display: flex; flex-direction: column; gap: .2rem; }
progress { width: 100%; height: 6px; appearance: none; -webkit-appearance: none; border: 0; border-radius: 99px; background: var(--soft); overflow: hidden; }
progress::-webkit-progress-bar { background: var(--soft); border-radius: 99px; }
progress::-webkit-progress-value { background: var(--accent); border-radius: 99px; transition: width .3s; }
progress::-moz-progress-bar { background: var(--accent); border-radius: 99px; }
.progress-line { display: flex; align-items: center; gap: .8rem; margin: -.4rem 0 1rem; }
.progress-line progress { flex: 1; height: 8px; }
.progress-line span { font-size: .85rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
.path-steps { list-style: none; padding: 0; margin: 0; counter-reset: s; display: grid; gap: .5rem; }
.path-steps li { counter-increment: s; position: relative; padding-left: 2.5rem; }
.path-steps li::before { content: counter(s); position: absolute; left: 0; top: .9rem; width: 1.8rem; height: 1.8rem; border-radius: 50%; display: grid; place-items: center; background: var(--soft); font-weight: 700; font-size: .8rem; color: var(--muted); }
.path-steps li.done::before { content: '✓'; background: var(--accent); color: #fff; }

/* Bibliothèque */
.searchbar { position: relative; margin: 0 0 .8rem; }
.searchbar .i { position: absolute; left: .85rem; top: 14px; color: var(--muted); }
.searchbar input { padding-left: 2.6rem; background: var(--surface); }
.prose { font-size: 1rem; line-height: 1.65; }
.prose ul, .prose ol { padding-left: 1.3rem; }
.prose li { margin-bottom: .25rem; }
.prose table { border-collapse: collapse; width: 100%; font-size: .88rem; margin: .6rem 0; display: block; overflow-x: auto; }
.prose th, .prose td { border-bottom: 1px solid var(--line); padding: .45rem .5rem; text-align: left; }
.prose > :last-child { margin-bottom: 0; }
.example { background: var(--accent-soft); border-radius: 10px; padding: .7rem .9rem; margin-top: 1rem; }
.t568 { columns: 2; font-size: .92rem; }
.quiz .q + .q { border-top: 1px solid var(--line); padding-top: .8rem; margin-top: .8rem; }
.opts { display: flex; flex-wrap: wrap; gap: .4rem; }
.opt { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 10px; padding: .5rem .9rem; font: inherit; cursor: pointer; min-height: 44px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.good { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--text); }
.opt.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.why { margin: .6rem 0 0; font-size: .92rem; }

/* Champs « grands » (calcul IP) */
.field-big input { font-size: 1.25rem; min-height: 58px; text-align: center; background: var(--surface); border-radius: 14px; font-family: ui-monospace, monospace; letter-spacing: .02em; }

function renderAnalyze(host, open, initial) {

function analyzeHtml(ipNum, cidr, open, guessed = false) {
  const a = ipc.analyze(ipNum, cidr);
  const notes = [];
  if (guessed) notes.push(`Pas de masque indiqué : masque par défaut de la classe ${a.cls.letter} (/${cidr}).`);
  if (a.isNetworkAddr) notes.push('C’est l’adresse du réseau : elle ne peut pas être donnée à une machine.');
  if (a.isBroadcastAddr) notes.push('C’est l’adresse de diffusion : elle ne peut pas être donnée à une machine.');
  if (a.type.label.startsWith('APIPA')) notes.push(a.type.note);

  const steps = `
    <ol class="steps">
      <li><strong>Adresse en binaire</strong> (8 bits par nombre)
        <div class="binrow"><span>${ipc.ipToStr(a.ip)}</span>${binColored(a.ip, cidr)}</div></li>
      <li><strong>Masque /${cidr}</strong> : ${cidr} bits à 1, puis des 0
        <div class="binrow"><span>${ipc.ipToStr(a.mask)}</span>${binColored(a.mask, cidr)}</div>
        <div class="legend"><span class="bn">■</span> réseau (${cidr} bits) <span class="bh">■</span> hôte (${32 - cidr} bits)</div></li>
      <li><strong>Adresse réseau</strong> : bits hôte mis à 0
        <div class="binrow"><span>${ipc.ipToStr(a.network)}</span>${binColored(a.network, cidr)}</div></li>
      <li><strong>Broadcast</strong> : bits hôte mis à 1
        <div class="binrow"><span>${ipc.ipToStr(a.broadcast)}</span>${binColored(a.broadcast, cidr)}</div></li>
      <li><strong>Machines</strong> : 2<sup>${32 - cidr}</sup> = ${fr(a.total)} adresses${cidr <= 30 ? `, moins le réseau et le broadcast = <strong>${fr(a.hosts)}</strong>` : ''}.</li>
    </ol>
    <p class="tip">Astuce : 256 − l’octet du masque qui n’est ni 0 ni 255 donne le pas entre deux réseaux. Ici : ${blockHint(a)}.</p>`;

  return `<div class="fade">
    ${notes.map((w) => `<p class="notice warn">${esc(w)}</p>`).join('')}
    <div class="card" id="an-sum">
      <div class="card-head"><h2>Résultat</h2><button class="icon-btn" id="an-copy" type="button" aria-label="Copier le résultat">${icon('copy', 18)}</button></div>
      <div class="stats two">
        <div><span>Réseau</span><b>${ipc.ipToStr(a.network)}<wbr>/${cidr}</b></div>
        <div><span>Machines</span><b>${fr(a.hosts)}</b></div>
        <div><span>Masque</span><b>${ipc.ipToStr(a.mask)}</b></div>
        <div><span>Broadcast</span><b>${ipc.ipToStr(a.broadcast)}</b></div>
      </div>
      <dl class="kv">
        <dt>Plage utilisable</dt><dd><code>${ipc.ipToStr(a.first)}</code> → <code>${ipc.ipToStr(a.last)}</code></dd>
        <dt>Wildcard</dt><dd><code>${ipc.ipToStr(a.wildcard)}</code></dd>
        <dt>Classe</dt><dd>${a.cls.letter}</dd>
        <dt>Type</dt><dd>${a.type.label}</dd>
      </dl>
    </div>
    ${explain('Comprendre le calcul', steps, open)}
  </div>`;
}

function blockHint(a) {
  const o = ipc.octets(a.mask);
  const idx = o.findIndex((x) => x !== 255);
  if (idx === -1) return '1 adresse';
  const block = 256 - o[idx];
  return `${block} sur le ${['1er', '2e', '3e', '4e'][idx]} octet`;
}

/* ---------- Convertir ---------- */
function renderConvert(host, open, params) {
  host.innerHTML = `
    <div class="field-big"><input id="cv-in" value="${esc(params.get('q') || '')}" placeholder="Ex. 192, 0b11000000 ou 0xC0" autocomplete="off" spellcheck="false" aria-label="Nombre à convertir"></div>
    <p class="hint center">Décimal, binaire (<code>0b…</code>) ou hexadécimal (<code>0x…</code>).</p>
    <div id="cv-out"></div>`;
  const run = () => {
    const out = $('#cv-out', host);
    const v = $('#cv-in', host).value.trim();
    if (!v) { out.innerHTML = empty('ip', 'La conversion apparaît ici.'); return; }
    const n = convertNumber(v);
    out.innerHTML = n === null ? '<p class="notice warn">Nombre non reconnu.</p>' : convertHtml(n, open);
  };
  $('#cv-in', host).addEventListener('input', debounce(run, 120));
  run();
}

function convertNumber(raw) {
  const s = String(raw).trim().toLowerCase().replace(/\s+/g, '');
  let n = null;
  if (/^0b[01]+$/.test(s)) n = parseInt(s.slice(2), 2);
  else if (/^[01]+b$/.test(s)) n = parseInt(s.slice(0, -1), 2);
  else if (/^0x[0-9a-f]+$/.test(s)) n = parseInt(s.slice(2), 16);
  else if (/^[0-9a-f]+h$/.test(s)) n = parseInt(s.slice(0, -1), 16);
  else if (/^\d+$/.test(s)) n = parseInt(s, 10);
  if (n === null || !Number.isSafeInteger(n)) return null;
  return n;
}

function convertHtml(n, open) {
  const bin = n.toString(2);
  const padded = bin.padStart(Math.ceil(bin.length / 8) * 8, '0');
  const weights = padded.split('').map((b, i) => ({ b, w: 2 ** (padded.length - 1 - i) }));
  const sum = weights.filter((x) => x.b === '1').map((x) => x.w);
  const steps = n <= 0xffff ? `
    <p>Chaque bit vaut une puissance de 2 (de droite à gauche : 1, 2, 4, 8, 16…). On additionne ceux qui sont à 1.</p>
    <div class="scroll"><table class="bits"><tr>${weights.map((x) => `<th>${x.w}</th>`).join('')}</tr><tr>${weights.map((x) => `<td class="${x.b === '1' ? 'on' : ''}">${x.b}</td>`).join('')}</tr></table></div>
    <p>${sum.length ? sum.join(' + ') + ' = <strong>' + n + '</strong>' : '0'}</p>` : '<p>Méthode : divisions successives par 2, en lisant les restes de bas en haut.</p>';
  return `<div class="card fade">
    <div class="stats two">
      <div><span>Décimal</span><b>${fr(n)}</b></div>
      <div><span>Hexadécimal</span><b>0x${n.toString(16).toUpperCase()}</b></div>
    </div>
    <dl class="kv"><dt>Binaire</dt><dd><code>${padded.replace(/(.{8})(?!$)/g, '$1 ')}</code></dd><dt>Octal</dt><dd><code>${n.toString(8)}</code></dd></dl>
    ${explain('Convertir à la main', steps, open)}
  </div>`;
}

return { meta, render, analyzeHtml, convertNumber, convertHtml };

      </div>
    </section>

    <section class="card">
      <h2>Modules</h2>
      <ul class="mod-list" id="mods"></ul>
    </section>

        <button class="btn ghost danger" id="d-rst" type="button">${icon('trash', 18)}Tout effacer</button>
      </div>
    </section>

    ${isFramed ? '' : `<section class="card">
      <h2>Installer</h2>
      <p class="hint">Installée, l’application fonctionne sans Internet.</p>
      ${window.__installPrompt ? `<button class="btn primary" id="inst" type="button">${icon('export', 18)}Installer l’application</button>` : '<p class="hint">Android (Chrome) : menu ⋮ puis « Installer l’application ». iPhone (Safari) : Partager puis « Sur l’écran d’accueil ».</p>'}
    </section>`}

    <p class="hint center">Mboa Lab 0.2 · logiciel libre (MIT) · aucune donnée envoyée</p>`;

  const drawMods = () => {
    $('#mods', root).innerHTML = s.modules.map((id, i) => {
      const m = byId[id];

      return `<li>
        <span class="mod-name">${icon(id, 20)}${esc(m.title)}</span>
        <span class="mod-ctl">
          <button type="button" class="icon-btn" data-move="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Monter">${icon('back', 16, 'up')}</button>
          <button type="button" class="icon-btn" data-move="${i}" data-d="1" ${i === s.modules.length - 1 ? 'disabled' : ''} aria-label="Descendre">${icon('back', 16, 'down')}</button>
          <input type="checkbox" role="switch" data-vis="${id}" ${s.hidden.includes(id) ? '' : 'checked'} ${LOCKED.includes(id) ? 'disabled' : ''} aria-label="Afficher ${esc(m.title)}">
        </span></li>`;
    }).join('');
  };

  root.addEventListener('input', (e) => {
    const t = e.target;
    if (t.name === 'appName') { s.appName = t.value.trim() || DEFAULT_SETTINGS.appName; apply(); }
    if (t.name === 'userName') { s.userName = t.value.trim(); apply(); }
    if (t.name === 'accent') { s.accent = t.value; $$('.swatch', root).forEach((b) => b.classList.toggle('on', b.dataset.accent === t.value)); apply(); }
  });
  root.addEventListener('change', (e) => {
    const t = e.target;
    if (t.name === 'theme') { s.theme = t.value; apply(); }
    if (t.name === 'fontScale') { s.fontScale = Number(t.value); apply(); }
    if (t.name === 'level') { s.level = t.value; drawHint(); apply(); }
    if (t.dataset.vis) { s.hidden = t.checked ? s.hidden.filter((x) => x !== t.dataset.vis) : [...s.hidden, t.dataset.vis]; apply(); }
  });
  root.addEventListener('click', async (e) => {
    const sw = e.target.closest('[data-accent]');
    if (sw) {
      s.accent = sw.dataset.accent;
      root.querySelector('[name=accent]').value = s.accent;
      $$('.swatch', root).forEach((b) => b.classList.toggle('on', b === sw));
      apply();
    }
    const mv = e.target.closest('[data-move]');
    if (mv) {
      const i = Number(mv.dataset.move);
      const j = i + Number(mv.dataset.d);
      [s.modules[i], s.modules[j]] = [s.modules[j], s.modules[i]];
      apply();
      drawMods();
    }
    if (e.target.closest('#d-exp')) exportText('Sauvegarder mes données', `mboalab-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(store.exportAll(), null, 2), 'application/json');
    if (e.target.closest('#d-rst') && await confirmBox('Effacer projets, fiches personnelles, progression et réglages ? Pensez à sauvegarder avant.', { ok: 'Tout effacer', danger: true })) {
      store.clearAll();
      const fresh = { ...DEFAULT_SETTINGS, modules: [...DEFAULT_SETTINGS.modules], hidden: [] };
      saveSettings(fresh);
      ctx.applySettings(fresh);
      toast('Données effacées');
      ctx.go('accueil');
    }
    if (e.target.closest('#inst')) {
      const p = window.__installPrompt;
      if (!p) return;
      p.prompt();
      await p.userChoice;
      window.__installPrompt = null;
      e.target.closest('#inst').remove();
    }
  });
  $('#d-imp', root).addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      store.importAll(JSON.parse(await file.text()));
      toast('Données restaurées');
      setTimeout(() => location.reload(), 600);
    } catch (err) {
      toast('Restauration impossible : ' + err.message);
    }
  });

  drawHint();
  drawMods();
}

return { meta, render };
})();
